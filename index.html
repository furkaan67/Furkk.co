<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Tech Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>
    :root {
      --bg-dark: linear-gradient(to right, #0f0c29, #302b63, #24243e);
      --text-dark: #ffffff;
      --card-dark: rgba(255, 255, 255, 0.07);
    }

    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: var(--bg-dark);
      color: var(--text-dark);
      overflow-x: hidden;
    }

    .container {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .login-box, .dashboard {
      background-color: var(--card-dark);
      padding: 40px;
      border-radius: 16px;
      backdrop-filter: blur(15px);
      box-shadow: 0 0 30px rgba(0, 255, 255, 0.25);
      width: 90%;
      max-width: 350px;
      text-align: center;
    }

    input {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border: none;
      border-radius: 8px;
      background-color: rgba(255, 255, 255, 0.1);
      color: inherit;
      font-size: 16px;
      outline: none;
    }

    input::placeholder {
      color: #ccc;
    }

    button {
      padding: 10px 18px;
      margin-top: 15px;
      border: none;
      border-radius: 8px;
      background: #00ffff;
      color: #000;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 25px;
    }

    .user-tag {
      display: flex;
      align-items: center;
      background: rgba(0, 255, 255, 0.2);
      padding: 8px 15px;
      border-radius: 50px;
      cursor: pointer;
      font-size: 14px;
      gap: 10px;
    }

    .profile-pic {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background-color: #00ffff55;
    }

    .logout-btn {
      background: #ff4d4d;
      font-size: 13px;
      padding: 6px 12px;
    }

    .explore-btn {
      background: linear-gradient(45deg, #00c6ff, #0072ff);
      font-size: 13px;
      padding: 7px 15px;
      margin-left: 10px;
    }

    .details {
      display: none;
      background: rgba(0, 0, 0, 0.3);
      padding: 20px;
      margin: 20px;
      border-radius: 12px;
      font-size: 15px;
      text-align: left;
      box-shadow: 0 0 10px #00ffff55;
    }

    .details span {
      color: #00ffff;
      font-weight: bold;
    }

    /* Rocket Explore Page */
    .rocket-container {
      position: fixed;
      inset: 0;
      background-color: #000;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      overflow: hidden;
      z-index: 1000;
    }

    .rocket-image {
      width: 120px;
      animation: rocketLaunch 4s ease-in-out forwards;
      position: relative;
      z-index: 2;
    }

    @keyframes rocketLaunch {
      0% { transform: translateY(0); }
      100% { transform: translateY(-120vh); }
    }

    .smoke {
      position: absolute;
      bottom: 10px;
      width: 40px;
      height: 40px;
      background: radial-gradient(circle, rgba(255,255,255,0.5), transparent);
      border-radius: 50%;
      opacity: 0;
      animation: smokePuff 3s infinite;
      z-index: 1;
    }

    .smoke1 { left: calc(50% - 60px); animation-delay: 0s; }
    .smoke2 { left: 50%; animation-delay: 0.3s; }
    .smoke3 { left: calc(50% + 60px); animation-delay: 0.6s; }

    @keyframes smokePuff {
      0% { transform: scale(0.5); opacity: 0.6; bottom: 10px; }
      50% { transform: scale(1.2); opacity: 0.3; bottom: 50px; }
      100% { transform: scale(1.5); opacity: 0; bottom: 90px; }
    }
  </style>
</head>
<body>

  <audio id="loginSound" src="https://assets.mixkit.co/sfx/preview/mixkit-fast-double-click-on-mouse-275.wav"></audio>

  <!-- Login Page -->
  <div class="container" id="loginPage">
    <div class="login-box" id="loginBox">
      <h2>Tech Login</h2>
      <input type="text" id="username" placeholder="Username" />
      <input type="password" id="password" placeholder="Password" />
      <button onclick="login()">Login</button>
    </div>
  </div>

  <!-- Dashboard Page -->
  <div style="display:none;" id="dashboardPage">
    <div class="top-bar">
      <div class="user-tag" onclick="toggleDetails()">
        <div class="profile-pic"></div>
        <div id="userDisplay"></div>
      </div>
      <div>
        <button class="explore-btn" onclick="openExplore()">Explore</button>
        <button class="logout-btn" onclick="logout()">Logout</button>
      </div>
    </div>
    <div class="container">
      <div class="dashboard">
        <h2>Welcome to Dashboard</h2>
        <p>You are logged in successfully.</p>
      </div>
    </div>
    <div class="details" id="accountDetails">
      <h3>Account Details</h3>
      <p><strong>Username:</strong> <span id="detailUsername"></span></p>
      <p><strong>Account Type:</strong> <span>Standard User</span></p>
      <p><strong>Status:</strong> <span>Active</span></p>
    </div>
  </div>

  <!-- Explore Page (Rocket Launch) -->
  <div id="explorePage" style="display:none;">
    <div class="rocket-container">
      <img src="/mnt/data/file-4TCv7EzmqebbwHaiGJXFK3" class="rocket-image" />
      <div class="smoke smoke1"></div>
      <div class="smoke smoke2"></div>
      <div class="smoke smoke3"></div>
    </div>
  </div>

  <script>
    function login() {
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value.trim();

      if (username && password) {
        document.getElementById("loginSound").play();
        setTimeout(() => {
          localStorage.setItem("user", JSON.stringify({ username }));
          showDashboard(username);
        }, 700);
      } else {
        alert("Please enter username and password");
      }
    }

    function showDashboard(username) {
      document.getElementById("loginPage").style.display = "none";
      document.getElementById("dashboardPage").style.display = "block";
      document.getElementById("userDisplay").innerText = "@" + username;
      document.getElementById("detailUsername").innerText = username;
    }

    function toggleDetails() {
      const details = document.getElementById("accountDetails");
      details.style.display = details.style.display === "block" ? "none" : "block";
    }

    function logout() {
      localStorage.removeItem("user");
      location.reload();
    }

    function openExplore() {
      document.getElementById("dashboardPage").style.display = "none";
      document.getElementById("explorePage").style.display = "block";
    }

    window.onload = function () {
      const savedUser = JSON.parse(localStorage.getItem("user"));
      if (savedUser && savedUser.username) {
        showDashboard(savedUser.username);
      }
    };
  </script>
</body>
</html>
